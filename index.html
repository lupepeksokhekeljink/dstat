<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Traffic Monitor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Real-Time Traffic Monitor</h1>
            <div class="status">
                <span id="statusIcon" class="status-icon">●</span>
                <span id="statusText">Connected</span>
            </div>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <h3>CPU Usage</h3>
                <div class="metric-value" id="cpuValue">0%</div>
                <canvas id="cpuChart"></canvas>
            </div>

            <div class="metric-card">
                <h3>Memory Usage</h3>
                <div class="metric-value" id="memValue">0%</div>
                <canvas id="memChart"></canvas>
            </div>

            <div class="metric-card">
                <h3>Network IN</h3>
                <div class="metric-value" id="netInValue">0 KB/s</div>
                <canvas id="netInChart"></canvas>
            </div>

            <div class="metric-card">
                <h3>Network OUT</h3>
                <div class="metric-value" id="netOutValue">0 KB/s</div>
                <canvas id="netOutChart"></canvas>
            </div>

            <div class="metric-card">
                <h3>Disk I/O Read</h3>
                <div class="metric-value" id="diskReadValue">0 KB/s</div>
                <canvas id="diskReadChart"></canvas>
            </div>

            <div class="metric-card">
                <h3>Disk I/O Write</h3>
                <div class="metric-value" id="diskWriteValue">0 KB/s</div>
                <canvas id="diskWriteChart"></canvas>
            </div>
        </div>

        <div class="raw-output">
            <h3>Raw dstat Output</h3>
            <pre id="rawOutput"></pre>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
